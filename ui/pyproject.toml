[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "saltbox-ui"
version = "0.1.0"
description = "Engine, terminal UI and web UI for Saltbox"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
dependencies = [
    "ruamel.yaml>=0.18,<0.20",
    "tld>=0.13",
]

[project.optional-dependencies]
docker = ["docker>=7"]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
sbx = "saltbox_ui.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["saltbox_ui"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
