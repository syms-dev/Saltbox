[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "saltbox-ui"
version = "0.1.0"
description = "Engine, terminal UI and web UI for Saltbox"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
dependencies = [
    "ruamel.yaml>=0.18,<0.20",
    "tld>=0.13",
    "textual>=8.0,<9",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
docker = ["docker>=7"]
serve = ["textual-serve>=1.1"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "httpx>=0.27",
]

[project.scripts]
sbx = "saltbox_ui.cli:main"
saltbox-ui = "saltbox_ui.tui.app:main"
saltbox-uid = "saltbox_ui.daemon.main:main"

[tool.hatch.build.targets.wheel]
packages = ["saltbox_ui"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012"]
