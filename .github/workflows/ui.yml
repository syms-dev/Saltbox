name: UI

on:
  push:
    branches: [master, 'claude/**']
    paths:
      - 'ui/**'
      - 'schema/**'
      - 'defaults/**'
      - 'roles/*/defaults/main.yml'
      - 'saltbox.yml'
      - '.github/workflows/ui.yml'
  pull_request:
    paths:
      - 'ui/**'
      - 'schema/**'
      - 'defaults/**'
      - 'roles/*/defaults/main.yml'
      - 'saltbox.yml'
      - '.github/workflows/ui.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine lint and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-saltbox-uv

      - name: Install
        working-directory: ui
        run: |
          uv python install --managed-python --no-bin "$(< ../.python-version)"
          uv venv --python "$(< ../.python-version)" --managed-python --no-project .venv
          uv pip install --python .venv/bin/python -e ".[dev,docker]"

      - name: Lint
        working-directory: ui
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

      - name: Test
        working-directory: ui
        run: .venv/bin/pytest

      - name: Smoke test the CLI against the checkout
        working-directory: ui
        env:
          SALTBOX_REPO: ${{ github.workspace }}
          SALTBOX_APPDATA: /tmp/sbx-appdata
          SALTBOX_UI_STATE: /tmp/sbx-state
        run: |
          .venv/bin/sbx catalog apps | python3 -c 'import json,sys; a=json.load(sys.stdin); assert len(a) > 50, a; print(len(a), "apps")'
          .venv/bin/sbx catalog fields sonarr > /dev/null
          .venv/bin/sbx run install core --dry-run
          # A runner is not a Saltbox server: preflight exits 3 when a blocking check fails.
          # What matters here is that it runs and reports every check.
          .venv/bin/sbx install preflight > /tmp/preflight.json || [ "$?" -eq 3 ]
          python3 -c 'import json; c=json.load(open("/tmp/preflight.json")); c=c.get("checks", c) if isinstance(c, dict) else c; assert len(c) >= 10, c; print(len(c), "preflight checks")'
          .venv/bin/sbx daemon unit | grep -q ExecStart

  web:
    name: Web app lint, tests and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/web/package-lock.json

      - name: Install
        working-directory: ui/web
        run: npm ci --no-audit --no-fund

      - name: Lint and typecheck
        working-directory: ui/web
        run: |
          npm run format:check
          npm run lint
          npm run typecheck

      - name: Test
        working-directory: ui/web
        run: npm test

      - name: Build
        working-directory: ui/web
        run: npm run build

      - uses: actions/upload-artifact@v5
        with:
          name: saltbox-web-dist
          path: ui/web/dist
          retention-days: 14

  e2e:
    name: Web app end to end (daemon + browser)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-saltbox-uv

      - name: Install the engine
        working-directory: ui
        run: |
          uv python install --managed-python --no-bin "$(< ../.python-version)"
          uv venv --python "$(< ../.python-version)" --managed-python --no-project .venv
          uv pip install --python .venv/bin/python -e ".[dev]"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/web/package-lock.json

      - name: Install the web app and Chromium
        working-directory: ui/web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: End to end tests
        working-directory: ui/web
        run: npm run e2e

  package:
    name: Package with the web app inside
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-saltbox-uv

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/web/package-lock.json

      - name: Build the web app
        working-directory: ui/web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build the wheel
        working-directory: ui
        run: |
          uv python install --managed-python --no-bin "$(< ../.python-version)"
          uv build --wheel --python "$(< ../.python-version)" --out-dir dist

      - name: Install it somewhere clean and serve the web app from it
        run: |
          uv venv --python "$(< .python-version)" /tmp/clean
          uv pip install --python /tmp/clean/bin/python ui/dist/*.whl
          mkdir -p /tmp/box/repo /tmp/box/opt /tmp/box/state
          cd /tmp/box
          SALTBOX_REPO=/tmp/box/repo SALTBOX_APPDATA=/tmp/box/opt SALTBOX_UI_STATE=/tmp/box/state \
            /tmp/clean/bin/saltbox-uid --host 127.0.0.1 --port 8795 --no-uds --no-token &
          for i in $(seq 30); do curl -sf -o /dev/null http://127.0.0.1:8795/api/meta && break; sleep 1; done
          curl -sf http://127.0.0.1:8795/api/meta | grep -q '"web":true'
          curl -sf http://127.0.0.1:8795/ | grep -q '<div id="root">'

      - uses: actions/upload-artifact@v5
        with:
          name: saltbox-ui-wheel
          path: ui/dist/*.whl
          retention-days: 14

